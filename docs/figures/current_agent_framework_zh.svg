<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#123047"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <marker id="cyanArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#67e8f9"/>
    </marker>
    <marker id="purpleArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#c084fc"/>
    </marker>
    <style>
      text { font-family: "Droid Sans Fallback", "Noto Sans CJK SC", sans-serif; }
      .title { font-size: 46px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-size: 21px; fill: #bae6fd; }
      .nodeTitle { font-size: 25px; font-weight: 700; fill: #f8fafc; }
      .body { font-size: 18px; fill: #dbeafe; }
      .small { font-size: 16px; fill: #bfdbfe; }
      .node { fill: #132f4c; stroke: #38bdf8; stroke-width: 2.4; rx: 20; filter: url(#shadow); }
      .agent { fill: #172554; stroke: #818cf8; stroke-width: 3; rx: 24; filter: url(#shadow); }
      .tool { fill: #134e4a; stroke: #2dd4bf; stroke-width: 2.4; rx: 18; filter: url(#shadow); }
      .ledger { fill: #164e63; stroke: #67e8f9; stroke-width: 2.4; rx: 18; filter: url(#shadow); }
      .policy { fill: #3b2754; stroke: #c084fc; stroke-width: 2.4; rx: 18; filter: url(#shadow); }
      .output { fill: #153e3a; stroke: #5eead4; stroke-width: 2.7; rx: 20; filter: url(#shadow); }
      .line { fill: none; stroke: #67e8f9; stroke-width: 3; marker-end: url(#cyanArrow); }
      .feedback { fill: none; stroke: #94a3b8; stroke-width: 2.5; stroke-dasharray: 9 8; marker-end: url(#cyanArrow); }
      .policyLine { fill: none; stroke: #c084fc; stroke-width: 3; marker-end: url(#purpleArrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1500" cy="60" r="230" fill="#0ea5e9" opacity="0.08"/>
  <circle cx="80" cy="860" r="250" fill="#14b8a6" opacity="0.07"/>

  <text x="70" y="68" class="title">当前政策可配置视频证据 Agent</text>
  <text x="72" y="106" class="subtitle">Student 自主取证与停止；工具产生可追溯证据；外部政策给出最终处置边界</text>

  <rect x="65" y="320" width="205" height="125" class="node"/>
  <text x="168" y="366" class="nodeTitle" text-anchor="middle">输入视频</text>
  <text x="168" y="402" class="body" text-anchor="middle">初始稀疏帧</text>

  <rect x="340" y="245" width="340" height="275" class="agent"/>
  <text x="510" y="295" class="nodeTitle" text-anchor="middle">Unified Student Agent</text>
  <text x="510" y="337" class="body" text-anchor="middle">读取累计证据与历史回执</text>
  <rect x="385" y="370" width="250" height="48" rx="12" fill="#24356f"/>
  <text x="510" y="401" class="small" text-anchor="middle">语义扫描 · 时序扩展 · ANSWER</text>
  <text x="510" y="459" class="body" text-anchor="middle">自主选择下一动作或停止</text>

  <rect x="770" y="175" width="290" height="120" class="tool"/>
  <text x="915" y="221" class="nodeTitle" text-anchor="middle">语义风险定位</text>
  <text x="915" y="258" class="body" text-anchor="middle">JOINT_SEMANTIC_SCAN</text>

  <rect x="770" y="340" width="290" height="120" class="tool"/>
  <text x="915" y="386" class="nodeTitle" text-anchor="middle">时序证据扩展</text>
  <text x="915" y="423" class="body" text-anchor="middle">TEMPORAL_EXPAND</text>

  <rect x="770" y="505" width="290" height="120" class="ledger"/>
  <text x="915" y="551" class="nodeTitle" text-anchor="middle">证据账本</text>
  <text x="915" y="588" class="body" text-anchor="middle">帧 · 时间点 · 工具回执</text>

  <rect x="1150" y="250" width="300" height="125" class="node"/>
  <text x="1300" y="297" class="nodeTitle" text-anchor="middle">终止证据报告</text>
  <text x="1300" y="334" class="body" text-anchor="middle">事实、证据与未解决项</text>

  <rect x="1150" y="470" width="300" height="120" class="policy"/>
  <text x="1300" y="516" class="nodeTitle" text-anchor="middle">外部版本化政策</text>
  <text x="1300" y="553" class="body" text-anchor="middle">政策文件 · 版本 · 内容哈希</text>

  <rect x="1150" y="690" width="300" height="120" class="output"/>
  <text x="1300" y="736" class="nodeTitle" text-anchor="middle">结构化处置</text>
  <text x="1300" y="773" class="body" text-anchor="middle">ALLOW · REVIEW · BLOCK</text>

  <path d="M272 382 L328 382" class="line"/>
  <path d="M682 310 L758 235" class="line"/>
  <path d="M682 382 L758 400" class="line"/>
  <path d="M915 297 L915 328" class="line"/>
  <path d="M915 462 L915 493" class="line"/>
  <path d="M1062 565 L1100 565 L1100 327 L1138 327" class="line"/>
  <path d="M1150 338 L1100 338 L1100 670 L510 670 L510 532" class="feedback"/>
  <text x="770" y="702" class="small" text-anchor="middle">新证据反馈到下一轮决策</text>
  <path d="M1300 377 L1300 678" class="line"/>
  <path d="M1300 592 L1300 678" class="policyLine"/>

  <rect x="65" y="720" width="915" height="90" rx="18" fill="#102d49" stroke="#38bdf8" stroke-width="2"/>
  <text x="95" y="756" class="body">训练：审核轨迹 SFT → Outcome-Cost GRPO</text>
  <text x="95" y="789" class="small">评测：冻结来源、种子、工具、预算与处理协议，进行 SFT / GRPO 配对比较</text>

  <text x="70" y="860" class="small">实线：前向信息流　虚线：Agent Loop 反馈　紫色：可替换政策层</text>
</svg>
